# Cloudflare Worker for the tier list editor. Setup steps: worker/README.md
# Secrets (PASSWORD, GITHUB_TOKEN, TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET) are NOT in this file,
# they're set with `npx wrangler secret put <NAME>` and stored by Cloudflare.

name = "tier-list-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
GITHUB_REPO = "DarkParasite/PortfolioWebsite"
GITHUB_BRANCH = "master"
SITE_DIR = "public"
DATA_PATH = "public/data/tiers.json"
ALLOWED_ORIGINS = "https://rishikhanna.dev,https://www.rishikhanna.dev,http://localhost:8080"

# 5 login attempts per minute per IP
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
